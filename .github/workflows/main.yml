name: CI/CD pipeline

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  pack:
    name: 📦 NuGet pack

    env:
      BUILD_CONFIG: Release
      SOLUTION: Crip.Extensions.ConfigLocator.slnx
      LIBRARY: src/Crip.Extensions.ConfigLocator/Crip.Extensions.ConfigLocator.csproj
      TESTS: tests/Crip.Extensions.ConfigLocator.Tests/Crip.Extensions.ConfigLocator.Tests.csproj

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: 📄 checkout
        uses: actions/checkout@v4

      - name: 💼 dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: 🔧 set default build version
        if: startsWith(github.ref, 'refs/tags/v') != true
        run: echo "BUILD_VERSION=1.0.0" >> $GITHUB_ENV
        shell: bash

      - name: 🔧 get build version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          BUILD_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
          echo $BUILD_VERSION
        shell: bash

      - name: 📥 setup .NET 8.0 & 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: 🔄 restore dependencies
        run: dotnet restore $SOLUTION

      - name: 🛠️ build
        run: dotnet build $LIBRARY -c $BUILD_CONFIG -p:Version=$BUILD_VERSION --no-restore -v m

      - name: 🧪 run tests
        run: dotnet test $TESTS /p:Configuration=$BUILD_CONFIG --no-restore -v m

      - name: 🚀 publish GitHub NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          find . -name "*${BUILD_VERSION}.nupkg" -print -quit | while read -r package; do
            dotnet nuget push "$package" \
              -s https://nuget.pkg.github.com/crip-home/index.json \
              -k ${{ secrets.GITHUB_TOKEN }} \
              --skip-duplicate
          done

      - name: 🔐 login to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: 🚀 publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          find . -name "*${BUILD_VERSION}.nupkg" -print -quit | while read -r package; do
            dotnet nuget push "$package" \
              -s 'https://api.nuget.org/v3/index.json' \
              -k ${{ steps.login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done